[project]
name = "agent-monitor"
version = "1.1.1"
description = "Standalone local Agent monitoring -- trace execution without remote dependencies"
requires-python = ">=3.10"
dependencies = [
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
]

[project.optional-dependencies]
instrument = [
    "openinference-instrumentation>=0.1.38",
]
openai = [
    "openinference-instrumentation-openai",
]
langchain = [
    "openinference-instrumentation-langchain",
]
llama-index = [
    "openinference-instrumentation-llama-index",
]
anthropic = [
    "openinference-instrumentation-anthropic",
]
google-genai = [
    "openinference-instrumentation-google-genai",
]
bedrock = [
    "openinference-instrumentation-bedrock",
]
dspy = [
    "openinference-instrumentation-dspy",
]
litellm = [
    "openinference-instrumentation-litellm",
]
groq = [
    "openinference-instrumentation-groq",
]
haystack = [
    "openinference-instrumentation-haystack",
]
autogen = [
    "openinference-instrumentation-autogen",
]
crewai = [
    "openinference-instrumentation-crewai",
]
smolagents = [
    "openinference-instrumentation-smolagents",
]
all-instruments = [
    "agent-monitor[instrument,openai,langchain,llama-index,anthropic,google-genai,bedrock,dspy,litellm,groq,haystack,autogen,crewai,smolagents]",
]

# Streamlit viewer + auto-refresh dep. Installed by
# `python -m agent_monitor init` by default; declare here so fresh
# checkouts can `pip install -e ".[viewer]"` and run the viewer
# without a separate manual install.
viewer = [
    "streamlit>=1.30",
    "streamlit-autorefresh>=1.0",
]

# pytest for the tests/ regression suite added in v1.1.1.
test = [
    "pytest>=7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_monitor"]

# Only the tests/ package holds real tests. The repo root also carries
# environment-specific dev scratch scripts (test_app.py / test_detail.py /
# smoke_test.py) that would otherwise be collected and fail.
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
