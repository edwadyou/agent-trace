[project]
name = "agent-monitor"
version = "1.1.1"
description = "Standalone local Agent monitoring -- trace execution without remote dependencies"
requires-python = ">=3.10"
dependencies = [
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    # Provides the `opentelemetry-instrument` command, `BaseDistro` and the
    # sitecustomize hook that agent_monitor/distro.py plugs into. It was already
    # a transitive dependency of openinference-instrumentation; the zero-code
    # entry point needs it whether or not any framework extra is installed.
    # (opentelemetry-distro is NOT needed: _load_distro() falls back to
    # DefaultDistro when OTEL_PYTHON_DISTRO names our entry point.)
    "opentelemetry-instrumentation>=0.51b0",
]

[project.optional-dependencies]
instrument = [
    "openinference-instrumentation>=0.1.38",
]
openai = [
    "openinference-instrumentation-openai",
]
langchain = [
    "openinference-instrumentation-langchain",
]
llama-index = [
    "openinference-instrumentation-llama-index",
]
anthropic = [
    "openinference-instrumentation-anthropic",
]
google-genai = [
    "openinference-instrumentation-google-genai",
]
bedrock = [
    "openinference-instrumentation-bedrock",
]
dspy = [
    "openinference-instrumentation-dspy",
]
litellm = [
    "openinference-instrumentation-litellm",
]
groq = [
    "openinference-instrumentation-groq",
]
haystack = [
    "openinference-instrumentation-haystack",
]
autogen = [
    "openinference-instrumentation-autogen",
]
crewai = [
    "openinference-instrumentation-crewai",
]
smolagents = [
    "openinference-instrumentation-smolagents",
]
all-instruments = [
    "agent-monitor[instrument,openai,langchain,llama-index,anthropic,google-genai,bedrock,dspy,litellm,groq,haystack,autogen,crewai,smolagents]",
]

# Streamlit viewer + auto-refresh dep. Installed by
# `python -m agent_monitor init` by default; declare here so fresh
# checkouts can `pip install -e ".[viewer]"` and run the viewer
# without a separate manual install.
viewer = [
    "streamlit>=1.30",
    "streamlit-autorefresh>=1.0",
]

# pytest for the tests/ regression suite added in v1.1.1.
test = [
    "pytest>=7",
]

# Zero-code entry point: `OTEL_PYTHON_DISTRO=agent-monitor
# opentelemetry-instrument python run.py` picks this up and starts writing
# ./latest_traces.jsonl without a single line of instrumentation code.
# Must be re-installed (`pip install -e .`) after editing this table -- entry
# points are read from the installed dist-info, not from the source tree.
[project.entry-points.opentelemetry_distro]
agent-monitor = "agent_monitor.distro:AgentMonitorDistro"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_monitor"]

# Only the tests/ package holds real tests. The repo root also carries
# environment-specific dev scratch scripts (test_app.py / test_detail.py /
# smoke_test.py) that would otherwise be collected and fail.
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
